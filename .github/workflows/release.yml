name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Package DMG
        run: |
          chmod +x package_dmg.sh build.sh
          ./package_dmg.sh

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/ClipboardMate.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
